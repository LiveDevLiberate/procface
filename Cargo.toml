[workspace]
members = ["."]
resolver = "2"

[package]
name = "procface"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "面向嵌入式 Linux 的 procfs 性能分析工具"

[features]
default = []
sqlite = ["dep:rusqlite"]
diagnostic = ["sqlite"]

[dependencies]
clap = { version = "=4.5.23", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
getrandom = "0.2"
ctrlc = "3.4"
axum = "0.7.9"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio-io-timeout = "1.2"
tokio = { version = "1.42", features = ["rt", "net", "sync", "time", "macros"] }
async-stream = "0.3"
base64 = "0.22"
ed25519-dalek = "2.1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
